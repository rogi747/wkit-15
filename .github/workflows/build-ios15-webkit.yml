name: Build iOS 15 WebKit (manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Alias python to python3
        run: |
          sudo ln -sf $(which python3) /usr/local/bin/python
          python --version

      - name: Fetch WebKit source
        run: |
          git clone --depth 1 --branch releases/Apple/Safari-15-iOS-15.0 https://github.com/WebKit/WebKit.git WebKit-15.0

      - name: Copy shims and apply patch
        run: |
          # Copy scripts vào trong WebKit-15.0 (đồng thời giữ bản gốc ở ngoài) để mọi cấp ../../ hoặc ../../../ đều hợp lệ
          cp -R scripts WebKit-15.0/

          # Chuẩn hóa CRLF và khoảng trắng U+00A0 (nếu có) trước khi apply patch
          python3 -c '
          with open("ios15-port.patch", "rb") as f:
              data = f.read().replace(b"\r\n", b"\n").replace(b"\xc2\xa0", b" ")
          with open("ios15-port.patch", "wb") as f:
              f.write(data)
          '

          # Apply patch
          git -C WebKit-15.0 apply --verbose --ignore-space-change ../ios15-port.patch

      - name: Build WebKit (device)
        run: |
          SHIM_INC="$(pwd)/scripts/abi-shims/include"
          ROOT_DIR="$(pwd)"

          # 1b. Tạo header shim cho các file <objc/...> cũ đã bị xóa trên iOS 17.5 SDK
          mkdir -p "${SHIM_INC}/objc"
          echo '#include <objc/runtime.h>' > "${SHIM_INC}/objc/objc-class.h"
          echo '#include <objc/runtime.h>' > "${SHIM_INC}/objc/objc-runtime.h"
          cp -R "${SHIM_INC}/objc" "WebKit-15.0/scripts/abi-shims/include/"

          # 1c. Copy header libxslt và libxml2 từ macOS SDK (vì iOS 17.5 SDK đã xóa các header này)
          MACOS_SDK_INC="/Applications/Xcode_15.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/usr/include"
          cp -R "${MACOS_SDK_INC}/libxslt" "${SHIM_INC}/"
          cp -R "${MACOS_SDK_INC}/libxml2" "${SHIM_INC}/"
          cp -R "${SHIM_INC}/libxslt" "WebKit-15.0/scripts/abi-shims/include/"
          cp -R "${SHIM_INC}/libxml2" "WebKit-15.0/scripts/abi-shims/include/"

          cd WebKit-15.0

          # 0. Runtime-only mode is applied here instead of relying on ios15-port.patch.
          #    This keeps the patch portable and guarantees the expensive test projects
          #    (DumpRenderTree/WebKitTestRunner/gtest/TestWebKitAPI/ImageDiff) are skipped.
          python3 - <<'PYRUNTIMEONLY'
          from pathlib import Path

          path = Path('Tools/Scripts/build-webkit')
          text = path.read_text()

          plain_tests = '    push @projects, ("Tools/DumpRenderTree", "Tools/WebKitTestRunner", "Source/ThirdParty/gtest", "Tools/TestWebKitAPI");'
          guarded_tests = "    push @projects, (\"Tools/DumpRenderTree\", \"Tools/WebKitTestRunner\", \"Source/ThirdParty/gtest\", \"Tools/TestWebKitAPI\") unless $ENV{'WK_RUNTIME_ONLY'};"
          if plain_tests in text:
              text = text.replace(plain_tests, guarded_tests, 1)
          elif guarded_tests not in text:
              raise RuntimeError('Unexpected build-webkit test-project list; cannot enable runtime-only mode safely')

          runtime_exit = "    exit 0 if $ENV{'WK_RUNTIME_ONLY'};\n\n"
          imagediff_marker = '    # Build ImageDiff for host\n'
          if runtime_exit not in text:
              if imagediff_marker not in text:
                  raise RuntimeError('ImageDiff marker missing from build-webkit')
              text = text.replace(imagediff_marker, runtime_exit + imagediff_marker, 1)

          path.write_text(text)

          final = path.read_text()
          if guarded_tests not in final:
              raise RuntimeError('runtime-only test-project guard was not installed')
          if runtime_exit.strip() not in final:
              raise RuntimeError('runtime-only ImageDiff exit was not installed')
          print('Patched build-webkit runtime-only mode')
          PYRUNTIMEONLY

          # 1. Tạo symlink cho iOS 17 PrivateFrameworkStubs
          if [ -d "WebKitLibraries/WebKitPrivateFrameworkStubs/iOS/15" ] && [ ! -e "WebKitLibraries/WebKitPrivateFrameworkStubs/iOS/17" ]; then
            ln -s 15 WebKitLibraries/WebKitPrivateFrameworkStubs/iOS/17
          fi

          # 2. Vô hiệu hóa readline trong jsc.cpp
          sed -i '' 's/#if HAVE(READLINE)/#if 0/' Source/JavaScriptCore/jsc.cpp

          # 2b. Sửa lỗi C++: không thể return nullptr cho hàm bool
          sed -i '' '170,185s/return nullptr;/return false;/' Source/WebCore/platform/graphics/cg/ImageBufferUtilitiesCG.cpp

          # 3. Link bổ sung WTF/bmalloc cho tool executables. Với các dynamic frameworks,
          #    dùng ld64 -load_hidden để archive vẫn thỏa undefined references nhưng không
          #    làm hàng nghìn WTF/bmalloc symbols trở thành API exports và khiến TAPI fail.
          echo 'OTHER_LDFLAGS = $(inherited) "$(BUILT_PRODUCTS_DIR)/libWTF.a" "$(BUILT_PRODUCTS_DIR)/libbmalloc.a" -framework CoreFoundation -framework Foundation -lobjc -licucore' >> Source/JavaScriptCore/Configurations/jsc.xcconfig
          echo 'OTHER_LDFLAGS = $(inherited) "$(BUILT_PRODUCTS_DIR)/libWTF.a" "$(BUILT_PRODUCTS_DIR)/libbmalloc.a" -framework CoreFoundation -framework Foundation -lobjc -licucore' >> Source/JavaScriptCore/Configurations/ToolExecutable.xcconfig
          echo 'OTHER_LDFLAGS = $(inherited) -Xlinker -load_hidden -Xlinker "$(BUILT_PRODUCTS_DIR)/libWTF.a" -licucore' >> Source/WebCore/Configurations/WebCore.xcconfig
          echo 'OTHER_LDFLAGS = $(inherited) -Xlinker -load_hidden -Xlinker "$(BUILT_PRODUCTS_DIR)/libWTF.a" -licucore' >> Source/WebKitLegacy/mac/Configurations/WebKitLegacy.xcconfig
          echo 'OTHER_LDFLAGS = $(inherited) -Xlinker -load_hidden -Xlinker "$(BUILT_PRODUCTS_DIR)/libWTF.a" -licucore' >> Source/WebKit/Configurations/WebKit.xcconfig

          echo '=== Verify hidden WTF archive linkage for dynamic frameworks ==='
          for xcconfig in \
            Source/WebCore/Configurations/WebCore.xcconfig \
            Source/WebKitLegacy/mac/Configurations/WebKitLegacy.xcconfig \
            Source/WebKit/Configurations/WebKit.xcconfig; do
            if ! grep -Fq -- '-Xlinker -load_hidden -Xlinker "$(BUILT_PRODUCTS_DIR)/libWTF.a"' "$xcconfig"; then
              echo "ERROR: $xcconfig does not hide libWTF.a symbols" >&2
              exit 1
            fi
          done
          echo 'OK: libWTF.a is linked privately into WebCore/WebKitLegacy/WebKit'

          # 3b. WebCoreTestSupport includes WebCore.xcconfig but overrides OTHER_LDFLAGS
          #     for iPhone targets, so it does not inherit the hidden WTF archive above.
          #     Internals*.o directly references WTF helpers; link the archive privately here too.
          python3 - <<'PYTESTSUPPORT'
          from pathlib import Path

          path = Path('Source/WebCore/Configurations/WebCoreTestSupport.xcconfig')
          text = path.read_text()
          hidden = '-Xlinker -load_hidden -Xlinker "$(BUILT_PRODUCTS_DIR)/libWTF.a"'
          old = 'OTHER_LDFLAGS[sdk=iphone*] = $(ASAN_OTHER_LDFLAGS) -lAccessibility -framework CoreText $(ANGLE_LDFLAGS) $(LIBWEBRTC_LDFLAGS);'
          new = 'OTHER_LDFLAGS[sdk=iphone*] = $(ASAN_OTHER_LDFLAGS) -lAccessibility -framework CoreText $(ANGLE_LDFLAGS) $(LIBWEBRTC_LDFLAGS) -Xlinker -load_hidden -Xlinker "$(BUILT_PRODUCTS_DIR)/libWTF.a" -licucore;'

          if hidden not in text:
              if old not in text:
                  raise RuntimeError('Unexpected WebCoreTestSupport iPhone OTHER_LDFLAGS')
              text = text.replace(old, new, 1)
              path.write_text(text)

          if hidden not in path.read_text():
              raise RuntimeError('WebCoreTestSupport hidden libWTF.a linkage missing')
          print('Patched WebCoreTestSupport hidden WTF linkage')
          PYTESTSUPPORT

          echo '=== Verify WebCoreTestSupport hidden WTF linkage ==='
          grep -nF -- '-Xlinker -load_hidden -Xlinker "$(BUILT_PRODUCTS_DIR)/libWTF.a"' \
            Source/WebCore/Configurations/WebCoreTestSupport.xcconfig
          echo 'OK: WebCoreTestSupport resolves Internals WTF references without exporting WTF'

          # 4. Xử lý xung đột SPI, tương thích C++ và Availability
          python3 -c '
          import re
          
          # 4a. Sửa UIKitSPI.h
          uikit_path = "Source/WebCore/PAL/pal/spi/ios/UIKitSPI.h"
          with open(uikit_path, "r") as f:
              c = f.read()
          c = c.replace("- (NSArray *)textLists;", "// - (NSArray *)textLists;")
          c = c.replace("- (void)setTextLists:(NSArray *)textLists;", "// - (void)setTextLists:(NSArray *)textLists;")
          c = c.replace("@interface NSTextList : NSObject", "#if !__has_include(<UIKit/NSTextList.h>)\n@interface NSTextList : NSObject")
          c = c.replace("- (NSString *)markerForItemNumber:(NSInteger)itemNum;\n@end", "- (NSString *)markerForItemNumber:(NSInteger)itemNum;\n@end\n#endif")
          with open(uikit_path, "w") as f:
              f.write(c)

          # 4b. Sửa AVFoundationSPI.h: Khai báo WKAVVideoPerformanceMetricsSPI protocol không dính API_UNAVAILABLE
          avf_path = "Source/WebCore/PAL/pal/spi/cocoa/AVFoundationSPI.h"
          with open(avf_path, "r") as f:
              avf = f.read()
          avf = re.sub(r"typedef\s+NS_ENUM\s*\(\s*NSInteger\s*,\s*AVExternalContentProtectionStatus\s*\)\s*\{[^}]*\}\s*;", "// AVExternalContentProtectionStatus is already defined", avf, flags=re.DOTALL)
          
          spi_protocol = """#if __has_include(<AVFoundation/AVVideoPerformanceMetrics.h>)
          #import <AVFoundation/AVVideoPerformanceMetrics.h>
          #endif
          @protocol WKAVVideoPerformanceMetricsSPI <NSObject>
          - (unsigned long)totalNumberOfVideoFrames;
          - (unsigned long)numberOfDroppedVideoFrames;
          - (unsigned long)numberOfCorruptedVideoFrames;
          - (unsigned long)numberOfDisplayCompositedVideoFrames;
          - (double)totalFrameDelay;
          @end"""

          avf = re.sub(r"@interface\s+AVVideoPerformanceMetrics\s*:\s*NSObject.*?@end", spi_protocol, avf, flags=re.DOTALL)
          with open(avf_path, "w") as f:
              f.write(avf)

          # 4c. Sửa IOSurfaceSPI.h
          iosurf_path = "Source/WebCore/PAL/pal/spi/cocoa/IOSurfaceSPI.h"
          with open(iosurf_path, "r") as f:
              iosurf = f.read()
          iosurf = re.sub(r"typedef\s+(?:CF_ENUM|NS_ENUM|CF_OPTIONS|NS_OPTIONS)\s*\([^,]+,\s*IOSurfaceMemoryLedgerTags\s*\)\s*\{[^}]*\}\s*;", "#include <IOSurface/IOSurfaceRef.h>", iosurf, flags=re.DOTALL)
          iosurf = re.sub(r"typedef\s+(?:CF_ENUM|NS_ENUM|CF_OPTIONS|NS_OPTIONS)\s*\([^,]+,\s*IOSurfaceMemoryLedgerFlags\s*\)\s*\{[^}]*\}\s*;", "// IOSurfaceMemoryLedgerFlags is already defined", iosurf, flags=re.DOTALL)
          with open(iosurf_path, "w") as f:
              f.write(iosurf)

          # 4d. Bổ sung <functional>
          vp9_path = "Source/WebCore/platform/graphics/cocoa/VP9UtilitiesCocoa.h"
          with open(vp9_path, "r") as f:
              vp9 = f.read()
          vp9 = vp9.replace("#pragma once\n", "#pragma once\n#include <functional>\n", 1)
          with open(vp9_path, "w") as f:
              f.write(vp9)

          for prefix in ["Source/WebCore/WebCorePrefix.h", "Source/WebKit/WebKit2Prefix.h", "Source/WebKitLegacy/mac/WebKitPrefix.h"]:
              try:
                  with open(prefix, "r") as f:
                      p = f.read()
                  p = p.replace("#ifdef __cplusplus\n", "#ifdef __cplusplus\n#include <functional>\n", 1)
                  with open(prefix, "w") as f:
                      f.write(p)
              except FileNotFoundError:
                  pass

          # 4e. Backport cơ chế NSTextListMarker của WebKit 16.4.
          #     Không tham chiếu trực tiếp các symbol UIKit vì WebCore không link UIKit.
          #     Các marker thực tế nằm trong UIFoundation và WebKit mới dùng soft-link getter.
          nsattr_path = "Source/WebCore/PAL/pal/spi/cocoa/NSAttributedStringSPI.h"
          with open(nsattr_path, "r") as f:
              nsattr = f.read()

          # Xóa mọi workaround/fallback cũ của các lượt build trước.
          nsattr = re.sub(
              r"^\s*#define\s+NSTextListMarker\w+\s+(?:WK_NSTextListMarker\w+|getNSTextListMarker\w+\(\))\s*$",
              "",
              nsattr,
              flags=re.MULTILINE,
          )
          nsattr = re.sub(
              r"^\s*static\s+(?:NSString\s*\*\s*const|NSTextListMarkerFormat\s+const)\s+(?:WK_)?NSTextListMarker\w+\s*=\s*@\"[^\"]+\";\s*$",
              "",
              nsattr,
              flags=re.MULTILINE,
          )
          nsattr = re.sub(
              r"^\s*SOFT_LINK_CONSTANT\(UIFoundation,\s*NSTextListMarker\w+,\s*NSTextListMarkerFormat\)\s*$",
              "",
              nsattr,
              flags=re.MULTILINE,
          )

          marker_block = "\n".join([
              "#import <UIKit/NSTextList.h>",
              "SOFT_LINK_CONSTANT(UIFoundation, NSTextListMarkerCircle, NSTextListMarkerFormat)",
              "#define NSTextListMarkerCircle getNSTextListMarkerCircle()",
              "SOFT_LINK_CONSTANT(UIFoundation, NSTextListMarkerDisc, NSTextListMarkerFormat)",
              "#define NSTextListMarkerDisc getNSTextListMarkerDisc()",
              "SOFT_LINK_CONSTANT(UIFoundation, NSTextListMarkerSquare, NSTextListMarkerFormat)",
              "#define NSTextListMarkerSquare getNSTextListMarkerSquare()",
              "SOFT_LINK_CONSTANT(UIFoundation, NSTextListMarkerLowercaseHexadecimal, NSTextListMarkerFormat)",
              "#define NSTextListMarkerLowercaseHexadecimal getNSTextListMarkerLowercaseHexadecimal()",
              "SOFT_LINK_CONSTANT(UIFoundation, NSTextListMarkerUppercaseHexadecimal, NSTextListMarkerFormat)",
              "#define NSTextListMarkerUppercaseHexadecimal getNSTextListMarkerUppercaseHexadecimal()",
              "SOFT_LINK_CONSTANT(UIFoundation, NSTextListMarkerOctal, NSTextListMarkerFormat)",
              "#define NSTextListMarkerOctal getNSTextListMarkerOctal()",
              "SOFT_LINK_CONSTANT(UIFoundation, NSTextListMarkerLowercaseAlpha, NSTextListMarkerFormat)",
              "#define NSTextListMarkerLowercaseAlpha getNSTextListMarkerLowercaseAlpha()",
              "SOFT_LINK_CONSTANT(UIFoundation, NSTextListMarkerUppercaseAlpha, NSTextListMarkerFormat)",
              "#define NSTextListMarkerUppercaseAlpha getNSTextListMarkerUppercaseAlpha()",
              "SOFT_LINK_CONSTANT(UIFoundation, NSTextListMarkerLowercaseLatin, NSTextListMarkerFormat)",
              "#define NSTextListMarkerLowercaseLatin getNSTextListMarkerLowercaseLatin()",
              "SOFT_LINK_CONSTANT(UIFoundation, NSTextListMarkerUppercaseLatin, NSTextListMarkerFormat)",
              "#define NSTextListMarkerUppercaseLatin getNSTextListMarkerUppercaseLatin()",
              "SOFT_LINK_CONSTANT(UIFoundation, NSTextListMarkerLowercaseRoman, NSTextListMarkerFormat)",
              "#define NSTextListMarkerLowercaseRoman getNSTextListMarkerLowercaseRoman()",
              "SOFT_LINK_CONSTANT(UIFoundation, NSTextListMarkerUppercaseRoman, NSTextListMarkerFormat)",
              "#define NSTextListMarkerUppercaseRoman getNSTextListMarkerUppercaseRoman()",
              "SOFT_LINK_CONSTANT(UIFoundation, NSTextListMarkerDecimal, NSTextListMarkerFormat)",
              "#define NSTextListMarkerDecimal getNSTextListMarkerDecimal()",
          ])

          # Đặt block sau NSTextAlternativesAttributeName, cùng vị trí upstream WebKit 16.4.
          anchor = "#define NSTextAlternativesAttributeName getNSTextAlternativesAttributeName()"
          if anchor not in nsattr:
              raise RuntimeError("Cannot find NSTextAlternativesAttributeName anchor in NSAttributedStringSPI.h")
          nsattr = nsattr.replace(anchor, anchor + "\n" + marker_block, 1)

          with open(nsattr_path, "w") as f:
              f.write(nsattr)

          # Preflight: phải có đủ 13 soft-link constants và không còn local static/WK alias.
          softlinked = re.findall(
              r"SOFT_LINK_CONSTANT\(UIFoundation,\s*(NSTextListMarker\w+),\s*NSTextListMarkerFormat\)",
              nsattr,
          )
          expected_markers = {
              "NSTextListMarkerCircle",
              "NSTextListMarkerDisc",
              "NSTextListMarkerSquare",
              "NSTextListMarkerLowercaseHexadecimal",
              "NSTextListMarkerUppercaseHexadecimal",
              "NSTextListMarkerOctal",
              "NSTextListMarkerLowercaseAlpha",
              "NSTextListMarkerUppercaseAlpha",
              "NSTextListMarkerLowercaseLatin",
              "NSTextListMarkerUppercaseLatin",
              "NSTextListMarkerLowercaseRoman",
              "NSTextListMarkerUppercaseRoman",
              "NSTextListMarkerDecimal",
          }
          if set(softlinked) != expected_markers:
              raise RuntimeError("NSTextListMarker soft-link set mismatch: " + repr(softlinked))
          if "WK_NSTextListMarker" in nsattr:
              raise RuntimeError("Stale WK_NSTextListMarker workaround remains")
          if re.search(r"^\s*static\s+.*NSTextListMarker", nsattr, flags=re.MULTILINE):
              raise RuntimeError("Stale static NSTextListMarker fallback remains")

          # 4f. Ép kiểu [metrics ...] sang [(id<WKAVVideoPerformanceMetricsSPI>)metrics ...] trong cả 2 file MediaPlayerPrivate
          files_to_fix = [
              "Source/WebCore/platform/graphics/avfoundation/objc/MediaPlayerPrivateMediaSourceAVFObjC.mm",
              "Source/WebCore/platform/graphics/avfoundation/objc/MediaPlayerPrivateAVFoundationObjC.mm"
          ]
          for file in files_to_fix:
              with open(file, "r") as f:
                  content = f.read()
              content = content.replace("[metrics ", "[(id<WKAVVideoPerformanceMetricsSPI>)metrics ")
              with open(file, "w") as f:
                  f.write(content)

          # 4g. Thêm JS_EXPORT_PRIVATE cho ~OpaqueJSClassContextData() trong JSClassRef.h để xuất symbol cho WebCore
          jsclass_path = "Source/JavaScriptCore/API/JSClassRef.h"
          with open(jsclass_path, "r") as f:
              jsc_h = f.read()
          jsc_h = jsc_h.replace("~OpaqueJSClassContextData();", "JS_EXPORT_PRIVATE ~OpaqueJSClassContextData();")
          with open(jsclass_path, "w") as f:
              f.write(jsc_h)

          # 4h. Gỡ ABI shim VTRestrictVideoDecoders cũ tại runtime.
          #     PAL/VideoToolboxSoftLink.cpp đã sở hữu hai symbol này; giữ shim sẽ duplicate khi link WebCore.
          vt_shim_path = "scripts/abi-shims/src/WebKitAdditionsABIShimIOS.mm"
          with open(vt_shim_path, "r") as f:
              vt_shim = f.read()

          vt_shim = re.sub(
              r"(?ms)^extern\s+\"C\"\s+__attribute__\(\(used,\s*visibility\(\"default\"\)\)\)\s*\n"
              r"void\*\s+palABIShimSoftLinkVTRestrictVideoDecoders\s*\n"
              r"\s*asm\(\"__ZN3PAL43softLinkVideoToolboxVTRestrictVideoDecodersE\"\)\s*=\s*nullptr;\s*\n?",
              "",
              vt_shim,
          )
          vt_shim = re.sub(
              r"(?ms)^extern\s+\"C\"\s+bool\s+palABIShimCanLoadVTRestrictVideoDecoders\(\)\s*\n"
              r"\s*__attribute__\(\(used,\s*visibility\(\"default\"\)\)\)\s*\n"
              r"\s*asm\(\"__ZN3PAL44canLoad_VideoToolbox_VTRestrictVideoDecodersEv\"\);\s*\n"
              r"\s*bool\s+palABIShimCanLoadVTRestrictVideoDecoders\(\)\s*\{\s*return\s+false;\s*\}\s*\n?",
              "",
              vt_shim,
          )

          stale_vt = [
              "__ZN3PAL43softLinkVideoToolboxVTRestrictVideoDecodersE",
              "__ZN3PAL44canLoad_VideoToolbox_VTRestrictVideoDecodersEv",
              "palABIShimSoftLinkVTRestrictVideoDecoders",
              "palABIShimCanLoadVTRestrictVideoDecoders",
          ]
          leftovers = [name for name in stale_vt if name in vt_shim]
          if leftovers:
              raise RuntimeError("Failed to remove stale VTRestrictVideoDecoders ABI shim: " + repr(leftovers))

          with open(vt_shim_path, "w") as f:
              f.write(vt_shim)

          # 4i. Gỡ Objective-C class chết WTFWebFileManagerDelegate khỏi WTF.
          #     libWTF.a được link vào WebCore, nên metadata ObjC của class này lọt vào
          #     WebCore.framework và vi phạm rule prefix chỉ cho phép Web / __ARCLite.
          #     Class này không được tham chiếu trong FileSystemCocoa.mm.
          wtf_fs_path = "Source/WTF/wtf/cocoa/FileSystemCocoa.mm"
          with open(wtf_fs_path, "r") as f:
              wtf_fs = f.read()

          delegate_pattern = (
              r"(?ms)^@interface\s+WTFWebFileManagerDelegate\s*:\s*NSObject\s*<NSFileManagerDelegate>\s*\n"
              r"@end\s*\n\s*"
              r"@implementation\s+WTFWebFileManagerDelegate\s*\n"
              r".*?"
              r"^@end\s*\n"
          )
          wtf_fs, delegate_count = re.subn(delegate_pattern, "", wtf_fs, count=1)
          if delegate_count != 1:
              raise RuntimeError("Expected exactly one WTFWebFileManagerDelegate block, removed " + str(delegate_count))
          if "WTFWebFileManagerDelegate" in wtf_fs:
              raise RuntimeError("WTFWebFileManagerDelegate remains after compatibility patch")

          with open(wtf_fs_path, "w") as f:
              f.write(wtf_fs)

          # 4j. Backport TAPI migrated-header workaround cho WebKitLegacy trên Xcode 15.
          #     WebKitLegacy re-export nhiều WebCore symbol nhưng các header tương ứng được
          #     MigrateHeaders.make copy bằng script, nên TAPI mới không tự xem chúng là API headers.
          #     WebKit hiện đại giải quyết bằng -extra-private-header cho toàn bộ migrated headers.
          legacy_xcconfig_path = "Source/WebKitLegacy/mac/Configurations/WebKitLegacy.xcconfig"
          with open(legacy_xcconfig_path, "r") as f:
              legacy_xcconfig = f.read()

          tapi_headers = [
              "WebKitAvailability.h",
              "WebScriptObject.h",
              "AbstractPasteboard.h",
              "KeyEventCodesIOS.h",
              "WAKAppKitStubs.h",
              "WAKResponder.h",
              "WAKView.h",
              "WAKWindow.h",
              "WKContentObservation.h",
              "WKGraphics.h",
              "WKTypes.h",
              "WebCoreThread.h",
              "WebCoreThreadMessage.h",
              "WebCoreThreadRun.h",
              "WebEvent.h",
              "WebItemProviderPasteboard.h",
          ]

          tapi_prefix = "OTHER_TAPI_FLAGS[sdk=iphone*] = "
          tapi_lines = [line for line in legacy_xcconfig.splitlines() if line.startswith(tapi_prefix)]
          if len(tapi_lines) != 1:
              raise RuntimeError("Expected exactly one iPhone OTHER_TAPI_FLAGS line in WebKitLegacy.xcconfig, found " + str(len(tapi_lines)))

          old_tapi_line = tapi_lines[0]

          # xcconfig uses the final semicolon as the statement terminator.  Do not
          # append new flags after it: Xcode would then pass the semicolon as part
          # of TestingFunctions.h (TestingFunctions.h;), which TAPI treats as a
          # different, non-existent filename.
          tapi_body = old_tapi_line.rstrip()
          if not tapi_body.endswith(";"):
              raise RuntimeError("Expected OTHER_TAPI_FLAGS to end with an xcconfig semicolon")
          tapi_body = tapi_body[:-1].rstrip()

          for header in tapi_headers:
              flag = " -extra-private-header $(BUILT_PRODUCTS_DIR)/$(PRIVATE_HEADERS_FOLDER_PATH)/" + header
              if flag not in tapi_body:
                  tapi_body += flag

          new_tapi_line = tapi_body + ";"
          legacy_xcconfig = legacy_xcconfig.replace(old_tapi_line, new_tapi_line, 1)
          with open(legacy_xcconfig_path, "w") as f:
              f.write(legacy_xcconfig)

          for header in tapi_headers:
              expected = "-extra-private-header $(BUILT_PRODUCTS_DIR)/$(PRIVATE_HEADERS_FOLDER_PATH)/" + header
              if expected not in legacy_xcconfig:
                  raise RuntimeError("Missing WebKitLegacy TAPI migrated header flag: " + header)

          final_tapi_lines = [line for line in legacy_xcconfig.splitlines() if line.startswith(tapi_prefix)]
          if len(final_tapi_lines) != 1:
              raise RuntimeError("Unexpected OTHER_TAPI_FLAGS line count after patch")
          final_tapi_line = final_tapi_lines[0]
          if "TestingFunctions.h; -extra-private-header" in final_tapi_line:
              raise RuntimeError("TAPI semicolon is still attached to TestingFunctions.h")
          if not final_tapi_line.endswith(";"):
              raise RuntimeError("Patched OTHER_TAPI_FLAGS lost its final xcconfig semicolon")

          # 4k. Python 3 compatibility cho Inspector code generator khi JavaScriptCore
          #     private headers bị flatten. Safari 15 dùng Python 2 semantics: relative
          #     import ngoài package ném ValueError; Python 3 ném ImportError. Vì vậy
          #     các fallback import cũ không chạy trên Xcode 15 / Python 3.
          codegen_dir = "Source/JavaScriptCore/inspector/scripts/codegen"
          patched_codegen_files = []

          for codegen_path in sorted(__import__("glob").glob(codegen_dir + "/*.py")):
              with open(codegen_path, "r") as f:
                  lines = f.readlines()

              changed = 0
              for i, line in enumerate(lines):
                  match = re.match(r"^(\s*)except ValueError:\s*$", line.rstrip("\n"))
                  if not match:
                      continue

                  indent = match.group(1)
                  # Find the matching top-level try block at the same indentation.
                  for j in range(i - 1, -1, -1):
                      candidate = lines[j].rstrip("\n")
                      if candidate == indent + "try:":
                          import_block = "".join(lines[j + 1:i])
                          if "from ." in import_block:
                              newline = "\n" if line.endswith("\n") else ""
                              lines[i] = indent + "except (ImportError, ValueError):" + newline
                              changed += 1
                          break

              if changed:
                  with open(codegen_path, "w") as f:
                      f.writelines(lines)
                  patched_codegen_files.append((codegen_path, changed))

          required_py3_files = [
              codegen_dir + "/generator.py",
              codegen_dir + "/cpp_generator.py",
              codegen_dir + "/objc_generator.py",
          ]
          for codegen_path in required_py3_files:
              with open(codegen_path, "r") as f:
                  codegen_text = f.read()
              if "except (ImportError, ValueError):" not in codegen_text:
                  raise RuntimeError("Python 3 flattened-import compatibility patch missing in " + codegen_path)

          print("Patched inspector codegen Python 3 imports:", patched_codegen_files)

          # 4l. Quote WebKitAdditions header search paths. Safari 15 used an unquoted
          #     [ ! -z $VAR ] test which breaks when Xcode 15 supplies multiple paths.
          derived_script_path = "Source/WebKit/Scripts/generate-derived-sources.sh"
          with open(derived_script_path, "r") as f:
              derived_script = f.read()
          old_webkitadditions_test = "if [ ! -z ${WEBKITADDITIONS_HEADER_SEARCH_PATHS} ]; then"
          new_webkitadditions_test = "if [ -n \"${WEBKITADDITIONS_HEADER_SEARCH_PATHS:-}\" ]; then"
          if old_webkitadditions_test in derived_script:
              derived_script = derived_script.replace(old_webkitadditions_test, new_webkitadditions_test, 1)
          elif new_webkitadditions_test not in derived_script:
              raise RuntimeError("Unexpected WEBKITADDITIONS_HEADER_SEARCH_PATHS test in generate-derived-sources.sh")
          with open(derived_script_path, "w") as f:
              f.write(derived_script)
          # 4m. Safari 15 keeps event modifiers as WebEvent::Modifier.
          #     ios15-port.patch adds a fallback WebTouchEvent for !ENABLE(TOUCH_EVENTS);
          #     do not use the newer standalone WebEventModifier type from later WebKit.
          webtouch_path = "Source/WebKit/Shared/WebTouchEvent.h"
          with open(webtouch_path, "r") as f:
              webtouch = f.read()
          stale_modifier = "OptionSet<WebEventModifier> m_modifiers;"
          safari15_modifier = "OptionSet<WebEvent::Modifier> m_modifiers;"
          if stale_modifier in webtouch:
              webtouch = webtouch.replace(stale_modifier, safari15_modifier, 1)
          if stale_modifier in webtouch:
              raise RuntimeError("stale WebEventModifier remains in WebTouchEvent fallback")
          if safari15_modifier not in webtouch:
              raise RuntimeError("Safari 15 WebTouchEvent fallback modifier field not found")
          with open(webtouch_path, "w") as f:
              f.write(webtouch)

          # 4n. Safari 15 owns resetPotentialTapSecurityOrigin only when
          #     ENABLE(IOS_TOUCH_EVENTS). A prior compatibility hunk added a
          #     definition under !ENABLE(IOS_TOUCH_EVENTS), while WebPage.h has no
          #     declaration there. Remove that dead fallback at runtime as well.
          webpage_cpp_path = "Source/WebKit/WebProcess/WebPage/WebPage.cpp"
          with open(webpage_cpp_path, "r") as f:
              webpage_cpp = f.read()
          stale_reset_block = "#if PLATFORM(IOS_FAMILY) && !ENABLE(IOS_TOUCH_EVENTS)\nvoid WebPage::resetPotentialTapSecurityOrigin()\n{\n    m_potentialTapSecurityOrigin = nullptr;\n}\n#endif\n\n"
          if stale_reset_block in webpage_cpp:
              webpage_cpp = webpage_cpp.replace(stale_reset_block, "", 1)
          if stale_reset_block in webpage_cpp:
              raise RuntimeError("stale resetPotentialTapSecurityOrigin fallback remains")
          with open(webpage_cpp_path, "w") as f:
              f.write(webpage_cpp)

          # 4o. Xcode 15 / iOS 17 SDK marks xpc_connection_get_pid() unavailable on iOS.
          #     Safari 15 receives the PID in ProcessLauncher before it invokes each
          #     didFinishLaunching() callback. Use that WebKit-owned PID for every
          #     process-throttler hookup instead of querying the XPC connection again.
          launcher_pid = "    m_throttler.didConnectToProcess(launcher->processIdentifier());"
          proxy_pid_patches = {
              "Source/WebKit/UIProcess/WebAuthentication/WebAuthnProcessProxy.cpp":
                  "    if (xpc_connection_t connection = this->connection()->xpcConnection())\n        m_throttler.didConnectToProcess(xpc_connection_get_pid(connection));",
              "Source/WebKit/UIProcess/Network/NetworkProcessProxy.cpp":
                  "    if (xpc_connection_t connection = this->connection()->xpcConnection())\n        m_throttler.didConnectToProcess(xpc_connection_get_pid(connection));",
              "Source/WebKit/UIProcess/GPU/GPUProcessProxy.cpp":
                  "    if (xpc_connection_t connection = this->connection()->xpcConnection())\n        m_throttler.didConnectToProcess(xpc_connection_get_pid(connection));",
              "Source/WebKit/UIProcess/WebProcessProxy.cpp":
                  "    if (connection()) {\n        if (xpc_connection_t xpcConnection = connection()->xpcConnection())\n            m_throttler.didConnectToProcess(xpc_connection_get_pid(xpcConnection));\n    }",
          }
          for proxy_path, stale_block in proxy_pid_patches.items():
              with open(proxy_path, "r") as f:
                  proxy_source = f.read()
              if stale_block in proxy_source:
                  proxy_source = proxy_source.replace(stale_block, launcher_pid, 1)
              if "xpc_connection_get_pid(" in proxy_source:
                  raise RuntimeError("stale xpc_connection_get_pid() remains in " + proxy_path)
              if launcher_pid not in proxy_source:
                  raise RuntimeError("ProcessLauncher PID compatibility patch missing in " + proxy_path)
              with open(proxy_path, "w") as f:
                  f.write(proxy_source)

          # 4p. Safari 15 declared UIDatePickerModeYearAndMonth as private SPI.
          #     Starting with the iOS 17.4 SDK, UIKit declares the same enumerator
          #     publicly. Keep the Safari 15 fallback only when compiling with an
          #     SDK older than 17.4; the value is compile-time, so this remains
          #     compatible with an eventual iOS 15 deployment target.
          webkit_uikit_path = "Source/WebKit/Platform/spi/ios/UIKitSPI.h"
          with open(webkit_uikit_path, "r") as f:
              webkit_uikit = f.read()
          date_picker_spi = "typedef NS_ENUM(NSInteger, UIDatePickerPrivateMode)  {\n    UIDatePickerModeYearAndMonth = 4269,\n};"
          guarded_date_picker_spi = "#if __IPHONE_OS_VERSION_MAX_ALLOWED < 170400\n" + date_picker_spi + "\n#endif"
          if date_picker_spi in webkit_uikit and guarded_date_picker_spi not in webkit_uikit:
              webkit_uikit = webkit_uikit.replace(date_picker_spi, guarded_date_picker_spi, 1)
          if guarded_date_picker_spi not in webkit_uikit:
              raise RuntimeError("UIDatePickerModeYearAndMonth SDK guard was not installed")
          with open(webkit_uikit_path, "w") as f:
              f.write(webkit_uikit)

          # 4q. Foundation from the Xcode 15.4 iOS SDK exposes xpc_connection_get_pid()
          #     as explicitly unavailable on iOS. Safari 15 still needs the peer PID in
          #     low-level IPC code. Derive the exact PID from the XPC audit token instead;
          #     audit_token_t stores the process ID in val[5] on Darwin. This also keeps
          #     ProcessLauncher/ConnectionCocoa independent of the unavailable declaration.
          xpc_spi_path = "Source/WTF/wtf/spi/darwin/XPCSPI.h"
          with open(xpc_spi_path, "r") as f:
              xpc_spi = f.read()
          xpc_pid_anchor = "void xpc_connection_get_audit_token(xpc_connection_t, audit_token_t*);"
          xpc_pid_helper = """static inline pid_t webkit_xpc_connection_get_pid(xpc_connection_t connection)
          {
              audit_token_t auditToken;
              xpc_connection_get_audit_token(connection, &auditToken);
              return (pid_t)auditToken.val[5];
          }"""
          if xpc_pid_helper not in xpc_spi:
              if xpc_pid_anchor not in xpc_spi:
                  raise RuntimeError("XPC audit-token declaration not found in XPCSPI.h")
              xpc_spi = xpc_spi.replace(xpc_pid_anchor, xpc_pid_anchor + "\n" + xpc_pid_helper, 1)
          with open(xpc_spi_path, "w") as f:
              f.write(xpc_spi)

          # Replace any remaining direct call in WebKit source. The UIProcess proxy calls
          # above already use ProcessLauncher::processIdentifier(); this catches IPC::Connection
          # and ProcessLauncher itself, plus any other Safari-15 call site we may have missed.
          from pathlib import Path as _Path
          for source_path in _Path("Source/WebKit").rglob("*"):
              if source_path.suffix not in {".cpp", ".mm", ".m", ".h"}:
                  continue
              source = source_path.read_text(errors="surrogateescape")
              if not re.search(r"(?<![A-Za-z0-9_])xpc_connection_get_pid\(", source):
                  continue
              source = re.sub(r"(?<![A-Za-z0-9_])xpc_connection_get_pid\(", "webkit_xpc_connection_get_pid(", source)
              source_path.write_text(source, errors="surrogateescape")

          # 4r. Safari 15 has a C++ type bug in InjectedBundle::initialize():
          #     one failure path returns Objective-C nil from a bool function. Older
          #     toolchains accepted this via legacy null-pointer conversion, while
          #     modern Clang maps nil to nullptr and rejects nullptr -> bool. WebKit
          #     fixed this upstream by returning false. Backport that exact fix.
          injected_bundle_path = "Source/WebKit/WebProcess/InjectedBundle/mac/InjectedBundleMac.mm"
          with open(injected_bundle_path, "r") as f:
              injected_bundle = f.read()
          injected_old = (
              "if (![m_platformBundle preflightAndReturnError:&error]) {\n"
              "            NSLog(@\"InjectedBundle::load failed - preflightAndReturnError failed, error: %@\", error);\n"
              "            return nil;\n"
              "        }"
          )
          injected_new = injected_old.replace("return nil;", "return false;")
          if injected_old in injected_bundle:
              injected_bundle = injected_bundle.replace(injected_old, injected_new, 1)
          if injected_new not in injected_bundle:
              raise RuntimeError("InjectedBundle bool-return compatibility fix was not installed")
          with open(injected_bundle_path, "w") as f:
              f.write(injected_bundle)

          # 4s. The Xcode 15.4 public iOS SDK marks xpc_main() unavailable, even
          #     though the WebKit XPC service entry point still relies on that libxpc
          #     symbol (and modern WebKit continues to use it with the Apple internal
          #     SDK). Resolve the existing runtime symbol via dlsym so we preserve
          #     Safari 15 XPC service behavior without compiling a direct
          #     reference to the unavailable SDK declaration.
          xpc_service_main_path = "Source/WebKit/Shared/EntryPointUtilities/Cocoa/XPCService/XPCServiceMain.mm"
          with open(xpc_service_main_path, "r") as f:
              xpc_service_main = f.read()
          if "#import <dlfcn.h>" not in xpc_service_main:
              cf_anchor = "#import <CoreFoundation/CoreFoundation.h>\n"
              if cf_anchor not in xpc_service_main:
                  raise RuntimeError("CoreFoundation include anchor not found in XPCServiceMain.mm")
              xpc_service_main = xpc_service_main.replace(cf_anchor, cf_anchor + "#import <dlfcn.h>\n", 1)
          xpc_main_helper = """static void webkitXPCMain(xpc_connection_handler_t handler)
          {
              using XPCMainFunction = void (*)(xpc_connection_handler_t);
              auto function = reinterpret_cast<XPCMainFunction>(dlsym(RTLD_DEFAULT, "xpc_main"));
              RELEASE_ASSERT(function);
              function(handler);
          }
          """
          if xpc_main_helper not in xpc_service_main:
              namespace_anchor = "namespace WebKit {\n"
              if namespace_anchor not in xpc_service_main:
                  raise RuntimeError("WebKit namespace anchor not found in XPCServiceMain.mm")
              xpc_service_main = xpc_service_main.replace(namespace_anchor, namespace_anchor + xpc_main_helper, 1)
          xpc_service_main = re.sub(
              r"(?m)^(\s*)xpc_main\(XPCServiceEventHandler\);$",
              r"\1webkitXPCMain(XPCServiceEventHandler);",
              xpc_service_main,
              count=1,
          )
          if re.search(r"(?<![A-Za-z0-9_])xpc_main\(XPCServiceEventHandler\)", xpc_service_main):
              raise RuntimeError("direct xpc_main(XPCServiceEventHandler) call remains")
          if "webkitXPCMain(XPCServiceEventHandler);" not in xpc_service_main:
              raise RuntimeError("XPCServiceMain compatibility call was not installed")
          with open(xpc_service_main_path, "w") as f:
              f.write(xpc_service_main)

          # 4t. Safari 15 _WKUserContentFilterPrivate.h forward-declares the old
          #     WKUserContentRuleList class, but its private initializer takes
          #     WKContentRuleList*. Modern WebKit carries both forward declarations.
          #     Newer Clang diagnoses the missing Objective-C type declaration.
          user_filter_private_path = "Source/WebKit/UIProcess/API/Cocoa/_WKUserContentFilterPrivate.h"
          with open(user_filter_private_path, "r") as f:
              user_filter_private = f.read()
          content_rule_decl = "@class WKContentRuleList;"
          old_rule_decl = "@class WKUserContentRuleList;"
          if content_rule_decl not in user_filter_private:
              if old_rule_decl not in user_filter_private:
                  raise RuntimeError("WKUserContentRuleList forward-declaration anchor not found")
              user_filter_private = user_filter_private.replace(
                  old_rule_decl,
                  content_rule_decl + "\n" + old_rule_decl,
                  1,
              )
          if content_rule_decl not in user_filter_private:
              raise RuntimeError("WKContentRuleList forward declaration was not installed")
          with open(user_filter_private_path, "w") as f:
              f.write(user_filter_private)

          '

          echo '=== Verify NSTextList soft-link backport ==='
          grep -nE 'UIKit/NSTextList.h|SOFT_LINK_CONSTANT\(UIFoundation, NSTextListMarker|#define NSTextListMarker' Source/WebCore/PAL/pal/spi/cocoa/NSAttributedStringSPI.h || true
          test "$(grep -c 'SOFT_LINK_CONSTANT(UIFoundation, NSTextListMarker' Source/WebCore/PAL/pal/spi/cocoa/NSAttributedStringSPI.h)" -eq 13 || {
            echo 'ERROR: expected exactly 13 NSTextListMarker soft-links' >&2
            exit 1
          }
          if grep -q 'WK_NSTextListMarker' Source/WebCore/PAL/pal/spi/cocoa/NSAttributedStringSPI.h; then
            echo 'ERROR: stale WK_NSTextListMarker workaround remains' >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]*static .*NSTextListMarker' Source/WebCore/PAL/pal/spi/cocoa/NSAttributedStringSPI.h; then
            echo 'ERROR: stale static NSTextListMarker fallback remains' >&2
            exit 1
          fi

          echo '=== Verify VTRestrictVideoDecoders is owned only by PAL ==='
          if grep -nE 'softLinkVideoToolboxVTRestrictVideoDecoders|canLoad_VideoToolbox_VTRestrictVideoDecoders' scripts/abi-shims/src/WebKitAdditionsABIShimIOS.mm; then
            echo 'ERROR: stale VTRestrictVideoDecoders ABI shim would duplicate libPAL.a' >&2
            exit 1
          fi
          grep -n 'VTRestrictVideoDecoders' Source/WebCore/PAL/pal/cf/VideoToolboxSoftLink.cpp || {
            echo 'ERROR: PAL VideoToolboxSoftLink.cpp no longer provides VTRestrictVideoDecoders' >&2
            exit 1
          }

          echo '=== Verify WebCore Objective-C class namespace compatibility ==='
          if grep -n 'WTFWebFileManagerDelegate' Source/WTF/wtf/cocoa/FileSystemCocoa.mm; then
            echo 'ERROR: WTFWebFileManagerDelegate would violate WebCore Objective-C prefix validation' >&2
            exit 1
          fi
          echo 'OK: dead WTFWebFileManagerDelegate removed before linking WebCore'

          echo '=== Verify WebKitLegacy TAPI migrated headers ==='
          grep -n 'OTHER_TAPI_FLAGS\[sdk=iphone\*\]' Source/WebKitLegacy/mac/Configurations/WebKitLegacy.xcconfig || true
          for header in WebKitAvailability.h WebScriptObject.h AbstractPasteboard.h KeyEventCodesIOS.h WAKAppKitStubs.h WAKResponder.h WAKView.h WAKWindow.h WKContentObservation.h WKGraphics.h WKTypes.h WebCoreThread.h WebCoreThreadMessage.h WebCoreThreadRun.h WebEvent.h WebItemProviderPasteboard.h; do
            grep -Fq -- "-extra-private-header \$(BUILT_PRODUCTS_DIR)/\$(PRIVATE_HEADERS_FOLDER_PATH)/${header}" Source/WebKitLegacy/mac/Configurations/WebKitLegacy.xcconfig || {
              echo "ERROR: missing TAPI migrated header flag for ${header}" >&2
              exit 1
            }
          done
          echo 'OK: WebKitLegacy TAPI sees all migrated WebCore headers'

          echo '=== Verify ProcessLauncher PID compatibility for UIProcess proxies ==='
          for proxy in \
            Source/WebKit/UIProcess/WebAuthentication/WebAuthnProcessProxy.cpp \
            Source/WebKit/UIProcess/Network/NetworkProcessProxy.cpp \
            Source/WebKit/UIProcess/GPU/GPUProcessProxy.cpp \
            Source/WebKit/UIProcess/WebProcessProxy.cpp; do
            if grep -n 'xpc_connection_get_pid(' "$proxy"; then
              echo "ERROR: xpc_connection_get_pid is unavailable in the iOS 17.5 SDK: $proxy" >&2
              exit 1
            fi
            grep -n 'm_throttler.didConnectToProcess(launcher->processIdentifier())' "$proxy" || {
              echo "ERROR: $proxy is not using ProcessLauncher PID" >&2
              exit 1
            }
          done
          echo 'OK: all UIProcess throttlers use ProcessLauncher PID instead of unavailable XPC API'

          echo '=== Verify UIDatePickerModeYearAndMonth SDK compatibility ==='
          grep -n -B1 -A4 'UIDatePickerPrivateMode' Source/WebKit/Platform/spi/ios/UIKitSPI.h || true
          python3 - <<'PYVERIFY'
          from pathlib import Path
          p = Path('Source/WebKit/Platform/spi/ios/UIKitSPI.h')
          s = p.read_text()
          expected = '#if __IPHONE_OS_VERSION_MAX_ALLOWED < 170400\ntypedef NS_ENUM(NSInteger, UIDatePickerPrivateMode)  {\n    UIDatePickerModeYearAndMonth = 4269,\n};\n#endif'
          if expected not in s:
              raise SystemExit('ERROR: Safari 15 UIDatePickerModeYearAndMonth fallback is not guarded for SDK 17.4+')
          print('OK: private UIDatePickerModeYearAndMonth is excluded when building against iOS 17.4+ SDKs')
          PYVERIFY

          echo '=== Verify XPC PID compatibility for Xcode 15 iOS SDK ==='
          grep -n -A6 'static inline pid_t webkit_xpc_connection_get_pid' Source/WTF/wtf/spi/darwin/XPCSPI.h || {
            echo 'ERROR: XPC audit-token PID helper is missing' >&2
            exit 1
          }
          if grep -R -n -E --include='*.cpp' --include='*.mm' --include='*.m' --include='*.h' '(^|[^[:alnum:]_])xpc_connection_get_pid\(' Source/WebKit; then
            echo 'ERROR: direct xpc_connection_get_pid() call remains under Source/WebKit and will fail with the iOS 17.5 SDK' >&2
            exit 1
          fi
          grep -n 'webkit_xpc_connection_get_pid' Source/WebKit/Platform/IPC/cocoa/ConnectionCocoa.mm Source/WebKit/UIProcess/Launcher/mac/ProcessLauncherMac.mm || {
            echo 'ERROR: expected Safari 15 IPC PID call sites were not converted' >&2
            exit 1
          }
          echo 'OK: WebKit derives XPC peer PID from the audit token instead of the unavailable SDK API'


          echo '=== Verify WKContentRuleList private-header declaration ==='
          grep -n -A3 -B1 '@class WKContentRuleList;' Source/WebKit/UIProcess/API/Cocoa/_WKUserContentFilterPrivate.h || {
            echo 'ERROR: WKContentRuleList forward declaration is missing from _WKUserContentFilterPrivate.h' >&2
            exit 1
          }
          python3 - <<'PYVERIFY'
          from pathlib import Path
          s = Path('Source/WebKit/UIProcess/API/Cocoa/_WKUserContentFilterPrivate.h').read_text()
          if '@class WKContentRuleList;' not in s:
              raise SystemExit('ERROR: WKContentRuleList is used before being declared')
          if '- (id)_initWithWKContentRuleList:(WKContentRuleList*)contentRuleList' not in s:
              raise SystemExit('ERROR: expected _initWithWKContentRuleList signature changed unexpectedly')
          print('OK: _WKUserContentFilterPrivate.h declares WKContentRuleList before use')
          PYVERIFY

          echo '=== Verify XPC service entry-point compatibility ==='
          grep -n -B2 -A8 'static void webkitXPCMain' Source/WebKit/Shared/EntryPointUtilities/Cocoa/XPCService/XPCServiceMain.mm || {
            echo 'ERROR: XPC service dlsym compatibility wrapper is missing' >&2
            exit 1
          }
          grep -n 'webkitXPCMain(XPCServiceEventHandler);' Source/WebKit/Shared/EntryPointUtilities/Cocoa/XPCService/XPCServiceMain.mm || {
            echo 'ERROR: XPCServiceMain still does not call the compatibility wrapper' >&2
            exit 1
          }
          if grep -n -E '(^|[^[:alnum:]_])xpc_main\(XPCServiceEventHandler\)' Source/WebKit/Shared/EntryPointUtilities/Cocoa/XPCService/XPCServiceMain.mm; then
            echo 'ERROR: direct xpc_main() is unavailable in the Xcode 15.4 public iOS SDK' >&2
            exit 1
          fi
          echo 'OK: XPC service resolves xpc_main dynamically instead of compiling the unavailable iOS SDK declaration'

          echo '=== Verify InjectedBundle bool-return compatibility ==='
          python3 - <<'PYVERIFY'
          from pathlib import Path
          p = Path('Source/WebKit/WebProcess/InjectedBundle/mac/InjectedBundleMac.mm')
          s = p.read_text()
          bad = 'preflightAndReturnError:&error]) {\n            NSLog(@"InjectedBundle::load failed - preflightAndReturnError failed, error: %@", error);\n            return nil;'
          good = bad.replace('return nil;', 'return false;')
          if bad in s:
              raise SystemExit('ERROR: InjectedBundle::initialize still returns nil from a bool function')
          if good not in s:
              raise SystemExit('ERROR: expected InjectedBundle preflight failure branch with return false was not found')
          print('OK: InjectedBundle::initialize returns false on preflight failure')
          PYVERIFY

          echo '=== Verify resetPotentialTapSecurityOrigin feature guard ==='
          if grep -n -B1 -A5 'void WebPage::resetPotentialTapSecurityOrigin()' Source/WebKit/WebProcess/WebPage/WebPage.cpp | grep -q '!ENABLE(IOS_TOUCH_EVENTS)'; then
            echo 'ERROR: resetPotentialTapSecurityOrigin fallback exists while IOS_TOUCH_EVENTS is disabled' >&2
            exit 1
          fi
          echo 'OK: no resetPotentialTapSecurityOrigin fallback outside ENABLE(IOS_TOUCH_EVENTS)'

          echo '=== Verify Safari 15 WebTouchEvent modifier type ==='
          if grep -n 'OptionSet<WebEventModifier> m_modifiers' Source/WebKit/Shared/WebTouchEvent.h; then
            echo 'ERROR: ios15 fallback uses newer WebEventModifier type unavailable in Safari 15' >&2
            exit 1
          fi
          grep -n 'OptionSet<WebEvent::Modifier> m_modifiers' Source/WebKit/Shared/WebTouchEvent.h || {
            echo 'ERROR: Safari 15 WebEvent::Modifier fallback field is missing' >&2
            exit 1
          }
          echo 'OK: WebTouchEvent fallback uses Safari 15 WebEvent::Modifier'

          echo '=== Verify Inspector codegen Python 3 flattened imports ==='
          grep -n 'except (ImportError, ValueError):' \
            Source/JavaScriptCore/inspector/scripts/codegen/generator.py \
            Source/JavaScriptCore/inspector/scripts/codegen/cpp_generator.py \
            Source/JavaScriptCore/inspector/scripts/codegen/objc_generator.py
          rm -rf /tmp/webkit-inspector-codegen-flat
          mkdir -p /tmp/webkit-inspector-codegen-flat
          cp Source/JavaScriptCore/inspector/scripts/generate-inspector-protocol-bindings.py /tmp/webkit-inspector-codegen-flat/
          cp Source/JavaScriptCore/inspector/scripts/codegen/*.py /tmp/webkit-inspector-codegen-flat/
          (cd /tmp/webkit-inspector-codegen-flat && python3 generate-inspector-protocol-bindings.py --help >/dev/null) || {
            echo 'ERROR: Inspector protocol generator still cannot run from flattened JavaScriptCore private headers' >&2
            exit 1
          }
          grep -n 'WEBKITADDITIONS_HEADER_SEARCH_PATHS' Source/WebKit/Scripts/generate-derived-sources.sh
          echo 'OK: Inspector generator imports cleanly under Python 3'

          echo '=== Verify runtime-only WebKit build mode ==='
          grep -n -F 'Tools/DumpRenderTree", "Tools/WebKitTestRunner", "Source/ThirdParty/gtest", "Tools/TestWebKitAPI") unless $ENV{'\''WK_RUNTIME_ONLY'\''};' Tools/Scripts/build-webkit || {
            echo 'ERROR: test projects are not guarded by WK_RUNTIME_ONLY after runtime transform' >&2
            exit 1
          }
          grep -n -F 'exit 0 if $ENV{'\''WK_RUNTIME_ONLY'\''};' Tools/Scripts/build-webkit || {
            echo 'ERROR: ImageDiff is not skipped in runtime-only mode after runtime transform' >&2
            exit 1
          }
          if grep -n -F 'push @projects, ("Tools/DumpRenderTree", "Tools/WebKitTestRunner", "Source/ThirdParty/gtest", "Tools/TestWebKitAPI");' Tools/Scripts/build-webkit; then
            echo 'ERROR: unguarded test-project list remains in build-webkit' >&2
            exit 1
          fi
          echo 'OK: runtime-only mode is installed; DumpRenderTree/WebKitTestRunner/gtest/TestWebKitAPI/ImageDiff are excluded'

          WK_RUNTIME_ONLY=1 Tools/Scripts/build-webkit --ios-device --release --use-ccache \
            WK_USE_CCACHE=YES \
            ARCHS='arm64 arm64e' \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_CFLAGS="\$(inherited) -isystem ${SHIM_INC} -I${ROOT_DIR} -I${SHIM_INC}/libxml2 -DHAVE_READLINE=0 -Wno-error -Wno-availability -Wno-deprecated-declarations -Wno-error=strict-prototypes -Wno-strict-prototypes" \
            OTHER_CPLUSPLUSFLAGS="\$(inherited) -isystem ${SHIM_INC} -I${ROOT_DIR} -I${SHIM_INC}/libxml2 -DHAVE_READLINE=0 -Wno-error -Wno-availability -Wno-deprecated-declarations -Wno-enum-constexpr-conversion"


          echo '=== Verify Mach-O deployment target is iOS 15.0 ==='
          python3 - <<'PYMINOS'
          from pathlib import Path
          import re
          import subprocess

          products = Path('WebKitBuild/Release-iphoneos')
          frameworks = [
              ('JavaScriptCore', products / 'JavaScriptCore.framework' / 'JavaScriptCore'),
              ('WebCore', products / 'WebCore.framework' / 'WebCore'),
              ('WebKitLegacy', products / 'WebKitLegacy.framework' / 'WebKitLegacy'),
              ('WebKit', products / 'WebKit.framework' / 'WebKit'),
          ]

          for name, binary in frameworks:
              if not binary.is_file():
                  raise SystemExit(f'ERROR: expected framework binary is missing: {binary}')
              result = subprocess.run(
                  ['xcrun', 'vtool', '-show-build', str(binary)],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  check=True,
              )
              print(f'--- {name} ---')
              print(result.stdout.rstrip())
              versions = re.findall(r'^\s*(?:minos|version)\s+([0-9.]+)\s*$', result.stdout, re.MULTILINE)
              if not versions:
                  raise SystemExit(f'ERROR: cannot determine deployment target for {name}')
              bad = [version for version in versions if version != '15.0']
              if bad:
                  raise SystemExit(f'ERROR: {name} contains non-iOS-15 deployment target(s): {bad}')
              print(f'OK: {name} minos={versions}')
          PYMINOS

          echo '=== Package runtime frameworks ==='
          tar -czf "${ROOT_DIR}/WebKit-iOS15-arm64-arm64e.tar.gz" \
            -C WebKitBuild/Release-iphoneos \
            JavaScriptCore.framework \
            WebCore.framework \
            WebKitLegacy.framework \
            WebKit.framework


      - name: Upload iOS 15 WebKit runtime frameworks
        uses: actions/upload-artifact@v4
        with:
          name: WebKit-iOS15-arm64-arm64e
          path: WebKit-iOS15-arm64-arm64e.tar.gz
          if-no-files-found: error
