      - name: Install pinned AOSP reclient 0.172 with matching Clang scanner
        working-directory: /home/runner/work/los
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          PINNED_COMMIT="943a1532c17256a37eb6d90cdba450ff761b36d1"
          PINNED_VERSION="0.172.0.3cf60ba5"
          PINNED_TREE="live"
          DEST="prebuilts/remoteexecution-client/compat-${PINNED_VERSION}"
          FETCH_DIR="$RUNNER_TEMP/reclient-pinned"

          mkdir -p "$FETCH_DIR" "$DEST" /tmp/rbe-test
